<title>Lee's UI Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Generated by tools/build-gallery.mjs from tools/gallery.template.html. Edit the template, not library/gallery.html. */
  /* The gallery is achromatic so the entries carry every colour. */
  :root{
    --bg:#efeff1;--sheet:#ffffff;--sunk:#e6e6e9;--ink:#111114;--ink2:#5f6268;--hair:#dedee2;--pill:#ffffff;
    --sh:0 1px 2px rgba(17,17,20,.04),0 22px 48px -26px rgba(17,17,20,.24);
    --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111113;--sheet:#1b1b1e;--sunk:#0a0a0b;--ink:#f1f1f3;--ink2:#a3a6ad;--hair:#2c2c31;--pill:#232327;--sh:0 22px 48px -26px rgba(0,0,0,.7)}}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#111113;--sheet:#1b1b1e;--sunk:#0a0a0b;--ink:#f1f1f3;--ink2:#a3a6ad;--hair:#2c2c31;--pill:#232327;--sh:0 22px 48px -26px rgba(0,0,0,.7)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:0 16px 64px}
  h1,h2,h3,p,ul,dl{margin:0}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .page{max-width:1240px;margin:0 auto}

  .top{display:grid;gap:10px;padding:48px 4px 24px}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .top h1{font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.04em;font-weight:600}
  .top p{max-width:60ch;color:var(--ink2)}

  .filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;margin:0 -4px 8px;
    background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--sunk)}
  .seg button{min-height:38px;padding:0 14px;border:0;border-radius:999px;background:none;font-weight:500;font-size:14px;cursor:pointer;color:var(--ink2)}
  .seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{min-height:32px;padding:0 11px;border:0;border-radius:999px;background:var(--pill);font-family:var(--mono);font-size:12px;color:var(--ink2);cursor:pointer;position:relative}
  .tag::after{content:"";position:absolute;inset:-6px -2px}
  .tag[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  .entry{background:var(--sheet);border-radius:28px;box-shadow:var(--sh);padding:10px;display:grid;gap:0;min-width:0}
  .entry[hidden]{display:none}
  .entry.screen{grid-column:1 / -1}
  .stage{position:relative;border-radius:20px;overflow:hidden;background:var(--sunk)}
  .stage iframe{display:block;width:100%;height:var(--h);border:0;background:transparent}
  .info{display:grid;gap:10px;padding:16px 12px 8px}
  .line1{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
  .entry h2{font-size:21px;letter-spacing:-.02em;font-weight:600;line-height:1.2}
  .origin{font-family:var(--mono);font-size:12px;color:var(--ink2)}
  .origin a{text-underline-offset:2px}
  .sum{font-size:16px;font-weight:500}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{padding:2px 9px;border-radius:999px;background:var(--bg);font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
  .chip.kind{background:var(--ink);color:var(--sheet)}
  details{border-top:1px solid var(--hair);margin-top:4px}
  summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;cursor:pointer;font-weight:500;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform 200ms var(--ease)}
  details[open] summary::after{transform:rotate(225deg) translate(-2px,-2px)}
  .why{color:var(--ink2);margin-bottom:12px;max-width:65ch}
  .take{padding-left:18px;display:grid;gap:6px;color:var(--ink);max-width:65ch;padding-bottom:10px}
  .take code,.why code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:1px 5px;border-radius:5px}
  .row{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 6px}
  .btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--bg);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--sunk)}
  .empty{padding:40px 4px;color:var(--ink2)}

  dialog{width:min(1100px,calc(100% - 24px));height:calc(100% - 24px);max-height:none;padding:0;border:0;border-radius:24px;background:var(--sheet);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(10,10,12,.55)}
  dialog .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 20px}
  dialog .bar h2{font-size:17px}
  dialog iframe{display:block;width:100%;height:calc(100% - 60px);border:0;background:var(--sunk)}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  @media (max-width:520px){.entry{border-radius:24px;padding:8px}.stage{border-radius:18px}.info{padding:14px 8px 6px}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>

<div class="page">
  <header class="top">
    <p class="count">{{COUNT}} entries · {{ORIGINALS}} original · {{STUDIES}} studies</p>
    <h1>The library</h1>
    <p>Excellent UI, kept to steal from. Each entry is live, so try it. Studies are credited rebuilds of public designs; originals are made from scratch.</p>
  </header>
  <nav class="filters" aria-label="Filter entries">
    <div class="seg" role="group" aria-label="Kind">
      <button type="button" data-kind="all" aria-pressed="true">All</button>
      <button type="button" data-kind="component" aria-pressed="false">Components</button>
      <button type="button" data-kind="screen" aria-pressed="false">Screens</button>
    </div>
    <div class="tags" role="group" aria-label="Tag">{{TAGS}}</div>
  </nav>
  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>Nothing matches that filter yet.</p>
</div>

<dialog id="full" aria-labelledby="fullTitle">
  <div class="bar"><h2 id="fullTitle"></h2><button class="btn" type="button" id="closeFull">Close</button></div>
  <iframe id="fullFrame" title=""></iframe>
</dialog>

<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var grid = document.getElementById('grid'), kind = 'all', tag = null;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  grid.innerHTML = data.map(function (e) {
    var o = e.origin.type === 'study'
      ? 'Study of <a href="' + esc(e.origin.url) + '" target="_blank" rel="noopener">' + esc(e.origin.name) + '</a>' + (e.origin.name.indexOf(e.origin.maker) > -1 ? '' : ' by ' + esc(e.origin.maker))
      : 'Original';
    return '<article class="entry ' + e.kind + '" data-id="' + e.id + '" aria-labelledby="t-' + e.id + '">' +
      '<div class="stage"><iframe title="' + esc(e.title) + ' demo" style="--h:' + e.height + 'px" loading="eager"></iframe></div>' +
      '<div class="info"><div class="line1"><h2 id="t-' + e.id + '">' + esc(e.title) + '</h2><span class="origin">' + o + '</span></div>' +
      '<p class="sum">' + esc(e.summary) + '</p>' +
      '<div class="meta"><span class="chip kind">' + e.kind + '</span>' + e.tags.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<details><summary>Why it works, and what to take</summary><p class="why">' + e.why + '</p><ul class="take">' + e.take + '</ul></details>' +
      '<div class="row"><button class="btn" type="button" data-full="' + e.id + '">Open full size</button></div></div></article>';
  }).join('');
  [].forEach.call(grid.querySelectorAll('.entry'), function (el, i) { el.querySelector('iframe').srcdoc = data[i].html; });

  function apply() {
    var shown = 0;
    [].forEach.call(grid.children, function (el, i) {
      var e = data[i], ok = (kind === 'all' || e.kind === kind) && (!tag || e.tags.indexOf(tag) > -1);
      el.hidden = !ok; if (ok) shown++;
    });
    document.getElementById('empty').hidden = shown > 0;
  }
  [].forEach.call(document.querySelectorAll('[data-kind]'), function (b, _, all) {
    b.addEventListener('click', function () { kind = b.dataset.kind; [].forEach.call(document.querySelectorAll('[data-kind]'), function (x) { x.setAttribute('aria-pressed', x === b); }); apply(); });
  });
  [].forEach.call(document.querySelectorAll('[data-tag]'), function (b) {
    b.addEventListener('click', function () {
      tag = tag === b.dataset.tag ? null : b.dataset.tag;
      [].forEach.call(document.querySelectorAll('[data-tag]'), function (x) { x.setAttribute('aria-pressed', x.dataset.tag === tag); });
      apply();
    });
  });

  var dlg = document.getElementById('full'), frame = document.getElementById('fullFrame');
  grid.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-full]'); if (!b) return;
    var e = data.filter(function (x) { return x.id === b.dataset.full; })[0];
    document.getElementById('fullTitle').textContent = e.title; frame.title = e.title + ' demo, full size'; frame.srcdoc = e.html;
    dlg.showModal();
  });
  document.getElementById('closeFull').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('close', function () { frame.srcdoc = ''; });
})();
</script>
