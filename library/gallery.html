  .sum{font-size:16px;font-weight:500}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{padding:2px 9px;border-radius:999px;background:var(--bg);font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
  .chip.kind{background:var(--ink);color:var(--sheet)}
  details{border-top:1px solid var(--hair);margin-top:4px}
  summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;cursor:pointer;font-weight:500;list-style:none}

  details[open] summary::after{transform:rotate(225deg) translate(-2px,-2px)}
  .why{color:var(--ink2);margin-bottom:12px;max-width:65ch}
  .take{padding-left:18px;display:grid;gap:6px;color:var(--ink);max-width:65ch;padding-bottom:10px}
  .take code,.why code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:1px 5px;border-radius:5px}
  .row{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 6px}
  .btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--bg);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--sunk)}
  .empty{padding:40px 4px;color:var(--ink2)}

  dialog{width:min(1100px,calc(100% - 24px));height:calc(100% - 24px);max-height:none;padding:0;border:0;border-radius:24px;background:var(--sheet);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}

  dialog .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 20px}
  dialog .bar h2{font-size:17px}
  dialog iframe{display:block;width:100%;height:calc(100% - 60px);border:0;background:var(--sunk)}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  @media (max-width:520px){.entry{border-radius:24px;padding:8px}.stage{border-radius:18px}.info{padding:14px 8px 6px}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>

ill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>',\n    archive:'\u003cpath d=\"M2.5 3h11v3h-11zM3.5 6v7h9V6M6.5 8.7h3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>'\n  };\n  var mod = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';\n  document.getElementById('mod').textContent = mod;\n  var groups = [\n    ['Issue', [['Change status…','status',['S']],['Assign to…','user',['A']],['Change priority…','prio',['P']],['Add label…','tag',['L']]]],\n    ['Navigate', [['Go to inbox','inbox',['G','then','I']],['Go to my issues','list',['G','then','M']],['Go to current cycle','cycle',['G','then','C']]]],\n    ['Actions', [['Create new issue','plus',['C']],['Copy issue link','link',[mod,'⇧','C']],['Archive issue','archive',[mod,'⌫']]]]\n  ];\n  var shell = document.getElementById('shell'), q = document.getElementById('q'), list = document.getElementById('list'), wrap = document.getElementById('wrap');\n  var items = [], active = 0, lastFocus = null;\n\n  // subsequence match: returns indices of matched characters, or null\n  function match(label, query) {\n    if (!query) return [];\n    var l = label.toLowerCase(), out = [], j = 0;\n    for (var i = 0; i \u003c l.length && j \u003c query.length; i++) if (l[i] === query[j]) { out.push(i); j++; }\n    return j === query.length ? out : null;\n  }\n  function esc(s) { return s.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;'); }\n  function highlight(label, idx) {\n    if (!idx.length) return esc(label);\n    return label.split('').map(function (c, i) { return idx.indexOf(i) > -1 ? '\u003cmark>' + esc(c) + '\u003c/mark>' : esc(c); }).join('');\n  }\n  function render() {\n    var query = q.value.trim().toLowerCase(), html = '', n = 0;\n    groups.forEach(function (g) {\n      var rows = '';\n      g[1].forEach(function (c) {\n        var m = match(c[0], query); if (!m) return;\n        var keys = c[2].map(function (k) ll.classList.remove('is-open');\n    setTimeout(function () { shell.hidden = true; }, 160);\n    (lastFocus && lastFocus !== document.body ? lastFocus : document.getElementById('opener')).focus();\n  }\n  q.addEventListener('input', render);\n  q.addEventListener('keydown', function (e) {\n    if (e.key === 'ArrowDown') { e.preventDefault(); select(active + 1); }\n    else if (e.key === 'ArrowUp') { e.preventDefault(); select(active - 1); }\n    else if (e.key === 'Enter' && items[active]) { e.preventDefault(); run(items[active]); }\n    else if (e.key === 'Escape') { e.preventDefault(); close(); }\n    else if (e.key === 'Tab') e.preventDefault();\n  });\n  list.addEventListener('pointermove', function (e) { var el = e.target.closest('.item'); if (el && +el.dataset.n !== active) select(+el.dataset.n, false); });\n  list.addEventListener('click', function (e) { var el = e.target.closest('.item'); if (el) run(el); });\n  document.getElementById('scrim').addEventListener('click', close);\n  document.getElementById('opener').addEventListener('click', open);\n  document.addEventListener('keydown', function (e) {\n    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); shell.hidden ? open() : close(); }\n  });\n  render();\n  // the demo opens with the menu showing; focus only if the frame already has focus\n  if (document.hasFocus()) q.focus();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","why":"It turns every action in the product into something you can type, and it knows what you're acting on: the current issue is shown as a chip above the search, so &quot;Change status…&quot; never needs a second question. It opens instantly and gets out of the way just as fast.","take":"\u003cli>Show the context the command applies to, above the input, so results can be verbs rather than nouns.\u003c/li>\u003cli>Put the shortcut on every row. The menu teaches the keyboard until you no longer need it.\u003c/li>\u003cli>Group results by intent (this item, go somewhere, do something), and keep group headers quieter than the rows.\u003c/li>\u003cli>Match on subsequences (&quot;chst&quot; finds &quot;Change status&quot;) and bold the matched letters so the match explains itself.\u003c/li>\u003cli>Animate the list height as results change so the panel doesn't jump.\u003c/li>\u003cli>The pointer and the keyboard share one highlight. Hovering moves it, and arrow keys carry on from there.\u003c/li>"},{"id":"stacked-toasts","title":"Stacked toasts","kind":"component","tags":["feedback","notification","gesture"],"origin":{"type":"study","maker":"Emil Kowalski","name":"Sonner","url":"https://sonner.emilkowal.ski"},"summary":"Many notifications in the space of one: a deck that fans out when you reach for it.","height":440,"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Stacked toasts\u003c/title>\n\u003cstyle>\n  :root{\n    --page:#fafafa;--toast:#ffffff;--ink:#171717;--ink2:#666;--line:#ededed;--btn:#171717;--btn-ink:#fff;\n    --ok:#1a7f37;--bad:#cf222e;--shadow:0 4px 12px rgba(0,0,0,.08);\n    --gap:14px;--peek:14px;--w:356px;\n    font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  }\n  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0a0a0a;--toast:#171717;--ink:#ededed;--ink2:#a1a1a1;--line:#262626;--btn:#ededed;--btn-ink:#0a0a0a;--ok:#3fb950;--bad:#ff6b6b;--shadow:0 4px 12px rgba(0,0,0,.4)}}\n  *{box-sizing:border-box}\n  html,body{height:100%}\n  body{margin:0;background:var(--page);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}\n  button{font:inherit}\n  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}\n  .demo{max-width:520px;padding:28px 20px 220px;display:grid;gap:14px}\n  .demo h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}\n  .demo p{margin:0;color:var(--ink2);line-height:1.55}\n  .row{display:flex;flex-wrap:wrap;gap:8px}\n  .row button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--toast);color:var(--ink);cursor:pointer}\n  .row button:hover{border-color:var(--ink2)}\n\n  /* the stack */\n  .toaster{position:fixed;right:24px;bottom:24px;width:var(--w);margin:0;padding:0;list-style:none;z-index:10}\n  .toaster::before{content:\"\";position:absolute;left:0;right:0;bottom:100%;height:var(--hover-pad,0px)} /* keeps hover alive across gaps */\n  .toast{position:absolute;right:0;bottom:0;width:100%;display:flex;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);border-radius:8px;\n    background:var(--toast);box-shadow:var(--shadow);color:var(--ink);font-size:13px;line-height:1.4;touch-action:none;user-select:none;\n    transform:var(--y,translateY(100%)) scale(var(--s,1));opacity:var(--o,0);transform-origin:center bottom;\n    transition:transform 400ms cubic-bezier(.21,1.02,.73,1),opacity 400ms ease,height 400ms ease}\n  .toast.dragging{transition:none}\n  .toast.back{overflow:hidden}\n  .toast > *{transition:opacity 200ms ease}\n  .toast.back > *{opacity:0}\n  .toast .ic{flex:none;width:16px;height:16px}\n  .toast .body{flex:1;min-width:0}\n  .toast .t{font-weight:500}\n  .toast .d{color:var(--ink2);margin-top:2px}\n  .toast .act{flex:none;min-height:28px;padding:0 10px;border:0;border-radius:6px;background:var(--btn);color:var(--btn-ink);font-size:12px;font-weight:500;cursor:pointer;position:relative}\n  .toast .act::after{content:\"\";position:absolute;inset:-8px -6px} /* 44px touch area around a 28px button */\n  .toast .close{position:absolute;left:-7px;top:-7px;width:20px;height:20px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:50%;\n    background:var(--toast);color:var(--ink2);cursor:pointer;opacity:0;transition:opacity 150ms}\n  .toaster:hover .close,.toast:focus-within .close{opacity:1}\n  .spin{animation:spin 800ms linear infinite}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @media (max-width:600px){.toaster{left:16px;right:16px;width:auto;bottom:16px}}\n  @media (prefers-reduced-motion:reduce){.toast{transition:opacity 150ms ease}.spin{animation-duration:2.4s}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"demo\">\n  \u003ch1>Stacked toasts\u003c/h1>\n  \u003cp>Toasts pile into a deck of three. Hover or focus the deck to fan it out. Swipe a toast down to dismiss it. The timer pauses while you’re reading.\u003c/p>\n  \u003cdiv class=\"row\">\n    \u003cbutton type=\"button\" data-t=\"save\">Save changes\u003c/button>\n    \u003cbutton type=\"button\" data-t=\"archive\">Archive 3 emails\u003c/button>\n    \u003cbutton type=\"button\" data-t=\"publish\">Publish post\u003c/button>\n    \u003cbutton type=\"button\" data-t=\"error\">Go offline\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003csection aria-label=\"Notifications\">\u003col class=\"toaster\" id=\"toaster\" aria-live=\"polite\">\u003c/ol>\u003c/section>\n\n\u003cscript>\n(function () {\n  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var toaster = document.getElementById('toaster'), toasts = [], expanded = false, seq = 0;\n  var VISIBLE = 3, GAP = 14, PEEK = 14, DURATION = 4000;\n  var icons = {\n    success:'\u003csvg class=\"ic\" viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003ccircle cx=\"8\" cy=\"8\" r=\"7.5\" fill=\"var(--ok)\"/>\u003cpath d=\"m4.8 8.2 2.1 2.1 4.3-4.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>',\n    error:'\u003csvg class=\"ic\" viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003ccircle cx=\"8\" cy=\"8\" r=\"7.5\" fill=\"var(--bad)\"/>\u003cpath d=\"M8 4.4v4.3\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\u003ccircle cx=\"8\" cy=\"11.2\" r=\".95\" fill=\"#fff\"/>\u003c/svg>',\n    loading:'\u003csvg class=\"ic spin\" viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003ccircle cx=\"8\" cy=\"8\" r=\"6.2\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"/>\u003cpath d=\"M8 1.8a6.2 6.2 0 0 1 6.2 6.2\" fill=\"none\" stroke=\"var(--ink2)\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>',\n    none:''\n  };\n\n  function content(t) {\n    return (icons[t.type] || '') + '\u003cdiv class=\"body\">\u003cdiv class=\"t\">' + t.title + '\u003c/div>' + (t.desc ? '\u003cdiv class=\"d\">' + t.desc + '\u003c/div>' : '') + '\u003c/div>' +\n      (t.action ? '\u003cbutton type=\"button\" class=\"act\">' + t.action + '\u003c/button>' : '') +\n      '\u003cbutton type=\"button\" class=\"close\" aria-label=\"Dismiss\">×\u003c/button>';\n  }\n  function add(t) {\n    t.id = ++seq; t.remaining = t.duration === undefined ? DURATION : t.duration;\n    var li = document.createElement('li'); li.className = 'toast'; li.innerHTML = content(t); t.el = li;\n    toaster.appendChild(li); toasts.unshift(t);\n    li.querySelector('.close').addEventListener('click', function () { remove(t); });\n    var act = li.querySelector('.act'); if (act) act.addEventListener('click', function () { t.onAction && t.onAction(); remove(t); });\n    drag(t);\n    requestAnimationFrame(function () { requestAnimationFrame(layout); });\n    tick(t);\n    return t;\n  }\n  function update(t, patch) {\n    Object.assign(t, patch); t.el.innerHTML = content(t);\n    t.el.querySelector('.close').addEventListener('click', function () { remove(t); });\n    t.remaining = t.duration === undefined ? DURATION : t.duration; tick(t); layout();\n  }\n  function remove(t) {\n    if (t.gone) return; t.gone = true; clearTimeout(t.timer);\n    toasts = toasts.filter(function (x) { return x !== t; });\n    t.el.style.setProperty('--o', 0);\n    t.el.style.setProperty('--y', 'translateY(' + (t.dragY > 0 ? '100%' : (reduce ? '0' : '40%')) + ')');\n    setTimeout(function () { t.el.remove(); }, 400);\n    layout();\n  }\n  function tick(t) {\n    clearTimeout(t.timer);\n    if (!isFinite(t.remaining) || expanded || document.hidden) return;\n    t.started = Date.now();\n    t.timer = setTimeout(function () { remove(t); }, t.remaining);\n  }\n  function pauseAll() { toasts.forEach(function (t) { if (t.timer && t.started) { clearTimeout(t.timer); t.remaining -= Date.now() - t.started; t.started = 0; } }); }\n  function resumeAll() { toasts.forEach(tick); }\n\n  // collapsed: a deck, each one PEEK px above and 5% smaller; expanded: stacked by real heights\n  function layout() {\n    if (expanded) toasts.forEach(function (t) { t.el.style.height = ''; t.el.classList.remove('back'); }); // measure natural heights\n    var offset = 0, frontH = toasts[0] ? toasts[0].el.offsetHeight : 0;\n    toasts.forEach(function (t, i) {\n      var el = t.el, h = el.offsetHeight, hidden = i >= VISIBLE;\n      el.style.zIndex = 100 - i;\n      el.inert = hidden;\n      if (expanded) {\n        el.style.height = '';\n        el.classList.remove('back');\n        el.style.setProperty('--y', 'translateY(' + (-offset + (t.dragY || 0)) + 'px)');\n        el.style.setProperty('--s', 1);\n        offset += h + GAP;\n      } else {\n        // back toasts take the front toast's height so the deck edges line up\n        el.style.height = i === 0 ? '' : frontH + 'px';\n        el.classList.toggle('back', i > 0);\n        el.style.setProperty('--y', 'translateY(' + (-PEEK * i + (i === 0 ? (t.dragY || 0) : 0)) + 'px)');\n        el.style.setProperty('--s', 1 - i * 0.05);\n      }\n      el.style.setProperty('--o', hidden ? 0 : 1);\n    });\n    toaster.style.setProperty('--hover-pad', expanded ? offset + 'px' : (PEEK * Math.min(toasts.length - 1, VISIBLE - 1)) + 'px');\n  }\n  function setExpanded(v) { if (expanded === v) return; expanded = v; v ? pauseAll() : resumeAll(); layout(); }\n  toaster.addEventListener('pointerenter', function () { setExpanded(true); });\n  toaster.addEventListener('pointerleave', function () { setExpanded(false); });\n  toaster.addEventListener('focusin', function () { setExpanded(true); });\n  toaster.addEventListener('focusout', function (e) { if (!toaster.contains(e.relatedTarget)) setExpanded(false); });\n  document.addEventListener('visibilitychange', function () { document.hidden ? pauseAll() : resumeAll(); });\n\n  // swipe down to dismiss: past 45px, or a fast flick\n  function drag(t) {\n    var el = t.el, y0 = 0, t0 = 0, on = false;\n    el.addEventListener('pointerdown', function (e) {\n      if (e.target.closest('button')) return;\n      on = true; y0 = e.clientY; t0 = Date.now(); el.setPointerCapture(e.pointerId); el.classList.add('dragging');\n    });\n    el.addEventListener('pointermove', function (e) {\n      if (!on) return; var dy = e.clientY - y0;\n      t.dragY = dy > 0 ? dy : dy * 0.15; // resists upward drags\n      layout();\n    });\n    function end(e) {\n      if (!on) return; on = false; el.classList.remove('dragging');\n      var dy = e.clientY - y0, v = dy / Math.max(1, Date.now() - t0);\n      if (dy > 45 || v > 0.11) remove(t); else { t.dragY = 0; layout(); }\n    }\n    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);\n  }\n\n  var actions = {\n    save: function () { add({ type: 'success', title: 'Changes saved' }); },\n    archive: function () { add({ type: 'none', title: '3 emails archived', desc: 'Moved out of your inbox.', action: 'Undo', onAction: function () { add({ type: 'success', title: 'Restored 3 emails' }); } }); },\n    publish: function () {\n      var t = add({ type: 'loading', title: 'Publishing…', duration: Infinity });\n      setTimeout(function () { update(t, { type: 'success', title: 'Post published', desc: 'It’s live at /notes/on-deadlines.', duration: undefined }); }, 1600);\n    },\n    error: function () { add({ type: 'error', title: 'You’re offline', desc: 'Changes will sync when you reconnect.' }); }\n  };\n  document.querySelectorAll('[data-t]').forEach(function (b) { b.addEventListener('click', function () { actions[b.dataset.t](); }); });\n\n  // the demo opens with a deck already showing; these stay until touched\n  add({ type: 'none', title: '3 emails archived', desc: 'Moved out of your inbox.', action: 'Undo', duration: Infinity, onAction: function () { add({ type: 'success', title: 'Restored 3 emails' }); } });\n  add({ type: 'error', title: 'You’re offline', desc: 'Changes will sync when you reconnect.', duration: Infinity });\n  add({ type: 'success', title: 'Post published', desc: 'It’s live at /notes/on-deadlines.', duration: Infinity });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","why":"Several notifications take the space of one. They collapse into a deck with a 14px peek, fan out when you reach for them, and pause their timers while you read. Everything about it assumes the person is busy and is only glancing at it.","take":"\u003cli>Collapse a stack into a deck: each toast behind sits 14px higher and 5% smaller, with its content hidden, so only the newest is readable.\u003c/li>\u003cli>Expand on hover or focus, and pause every timer while the stack is expanded or the tab is hidden.\u003c/li>\u003cli>Keep the hover alive across the gaps between expanded toasts with an invisible pad, so the stack doesn't collapse as the pointer crosses a gap.\u003c/li>\u003cli>Swipe down to dismiss past a distance (45px) or on a fast flick (velocity over 0.11px/ms), whichever comes first. Resist upward drags.\u003c/li>\u003cli>Use a promise toast: &quot;Publishing…&quot; becomes &quot;Post published&quot; in place, rather than one toast replacing another.\u003c/li>\u003cli>Put the close button on the corner, visible only on hover or focus.\u003c/li>"},{"id":"bottom-drawer","title":"Bottom drawer","kind":"component","tags":["overlay","mobile","gesture"],"origin":{"type":"study","maker":"Emil Kowalski","name":"Vaul","url":"https://vaul.emilkowal.ski"},"summary":"The page recedes like a card, and every layer follows your finger.","height":640,"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Bottom drawer\u003c/title>\n\u003cstyle>\n  :root{\n    --backdrop:#000;--page:#ffffff;--ink:#111;--ink2:#6b6b70;--line:#ececee;--sheet:#ffffff;--well:#f4f4f5;--handle:#d4d4d8;\n    --ease:cubic-bezier(.32,.72,0,1);--dur:500ms;\n    font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  }\n  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#161618;--ink:#f1f1f3;--ink2:#a0a0a8;--line:#2a2a2e;--sheet:#1e1e21;--well:#29292d;--handle:#46464c}}\n  *{box-sizing:border-box}\n  html,body{height:100%}\n  body{margin:0;background:#e9e9ec;display:grid;place-items:center;padding:16px;-webkit-font-smoothing:antialiased}\n  @media (prefers-color-scheme:dark){body{background:#0b0b0c}}\n  button{font:inherit;color:inherit}\n  :focus-visible{outline:2px solid #0a84ff;outline-offset:2px}\n\n  /* a phone-sized stage so the effect reads at any width */\n  .device{position:relative;width:min(390px,100%);height:min(760px,calc(100vh - 32px));min-height:560px;border-radius:28px;overflow:hidden;background:var(--backdrop);isolation:isolate}\n  .page{position:absolute;inset:0;background:var(--page);color:var(--ink);overflow:hidden;transform-origin:50% 0;\n    transition:transform var(--dur) var(--ease),border-radius var(--dur) var(--ease)}\n  .page header{padding:54px 20px 10px;display:flex;justify-content:space-between;align-items:center}\n  .page header p{margin:0;font-size:13px;color:var(--ink2)}\n  .page h1{margin:0 20px;font-size:28px;letter-spacing:-.02em;line-height:1.1}\n  .list{margin:18px 20px 0;padding:0;list-style:none}\n  .list li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}\n  .list li span:last-child{color:var(--ink2);font-variant-numeric:tabular-nums}\n  .share{min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--well);font-weight:600;font-size:14px;cursor:pointer}\n\n  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease);z-index:2}\n  .drawer{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--sheet);color:var(--ink);border-radius:14px 14px 0 0;\n    padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform var(--dur) var(--ease);touch-action:none}\n  .drawer[hidden]{display:block!important;visibility:hidden}\n  .grab{display:block;width:100%;height:24px;margin:-4px 0 6px;padding:0;border:0;background:none;cursor:grab}\n  .grab::before{content:\"\";display:block;width:36px;height:5px;margin:0 auto;border-radius:3px;background:var(--handle)}\n  .drawer h2{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}\n  .drawer .sub{margin:0 0 18px;font-size:14px;color:var(--ink2)}\n  .people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}\n  .person{display:grid;justify-items:center;gap:6px;padding:0;border:0;background:none;font-size:12px;cursor:pointer;min-height:44px}\n  .person i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:16px;color:#fff}\n  .acts{display:grid;gap:8px}\n  .acts button{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--well);font-size:15px;cursor:pointer;text-align:left}\n  .acts button span:last-child{color:var(--ink2);font-size:13px}\n\n  /* open: the page recedes like a card behind the sheet */\n  .open .page{transform:translateY(14px) scale(var(--bg-scale,.93));border-radius:12px}\n  .open .overlay{opacity:1;pointer-events:auto}\n  .open .drawer{transform:translateY(0)}\n  .dragging .page,.dragging .overlay,.dragging .drawer{transition:none}\n  @media (prefers-reduced-motion:reduce){:root{--dur:1ms}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"device open\" id=\"device\">\n  \u003cmain class=\"page\" id=\"page\">\n    \u003cheader>\u003cp>Saturday, 09:10\u003c/p>\u003cbutton class=\"share\" type=\"button\" id=\"opener\" aria-haspopup=\"dialog\">Share\u003c/button>\u003c/header>\n    \u003ch1>Market list\u003c/h1>\n    \u003cul class=\"list\">\n      \u003cli>\u003cspan>Sourdough, large\u003c/span>\u003cspan>1\u003c/span>\u003c/li>\n      \u003cli>\u003cspan>Blood oranges\u003c/span>\u003cspan>6\u003c/span>\u003c/li>\n      \u003cli>\u003cspan>Comté, 18 months\u003c/span>\u003cspan>200 g\u003c/span>\u003c/li>\n      \u003cli>\u003cspan>Leeks\u003c/span>\u003cspan>3\u003c/span>\u003c/li>\n      \u003cli>\u003cspan>Flowers for Ana\u003c/span>\u003cspan>1 bunch\u003c/span>\u003c/li>\n    \u003c/ul>\n  \u003c/main>\n  \u003cdiv class=\"overlay\" id=\"overlay\">\u003c/div>\n  \u003csection class=\"drawer\" id=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dh\">\n    \u003cbutton class=\"grab\" type=\"button\" id=\"grab\" aria-label=\"Close share sheet\">\u003c/button>\n    \u003ch2 id=\"dh\">Share “Market list”\u003c/h2>\n    \u003cp class=\"sub\">5 items · edited 4 minutes ago\u003c/p>\n    \u003cdiv class=\"people\">\n      \u003cbutton class=\"person\" type=\"button\">\u003ci style=\"background:#c2410c\">AM\u003c/i>Ana\u003c/button>\n      \u003cbutton class=\"person\" type=\"button\">\u003ci style=\"background:#0f766e\">JO\u003c/i>Jonah\u003c/button>\n      \u003cbutton class=\"person\" type=\"button\">\u003ci style=\"background:#4338ca\">RI\u003c/i>Rita\u003c/button>\n      \u003cbutton class=\"person\" type=\"button\">\u003ci style=\"background:#57534e\">+\u003c/i>More\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"acts\">\n      \u003cbutton type=\"button\">\u003cspan>Copy link\u003c/span>\u003cspan>Anyone with the link\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\">\u003cspan>Send a copy\u003c/span>\u003cspan>Plain text\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var device = document.getElementById('device'), drawer = document.getElementById('drawer'), page = document.getElementById('page');\n  var overlay = document.getElementById('overlay'), opener = document.getElementById('opener');\n  var SCALE = 0.93;\n  function open() { drawer.hidden = false; device.classList.add('open'); page.inert = true; setTimeout(function () { document.getElementById('grab').focus(); }, 50); }\n  function close() {\n    device.classList.remove('open'); page.inert = false; opener.focus();\n    setTimeout(function () { if (!device.classList.contains('open')) drawer.hidden = true; }, 500);\n  }\n  opener.addEventListener('click', open);\n  overlay.addEventListener('click', close);\n  document.getElementById('grab').addEventListener('click', close);\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && device.classList.contains('open')) close(); });\n\n  // drag: the sheet follows the finger; the page and overlay follow the sheet's progress\n  var y0 = 0, t0 = 0, dy = 0, dragging = false;\n  drawer.addEventListener('pointerdown', function (e) {\n    if (e.target.closest('.person, .acts button')) return;\n    dragging = true; y0 = e.clientY; t0 = Date.now(); dy = 0;\n    drawer.setPointerCapture(e.pointerId); device.classList.add('dragging');\n  });\n  drawer.addEventListener('pointermove', function (e) {\n    if (!dragging) return;\n    var raw = e.clientY - y0;\n    dy = raw >= 0 ? raw : -8 * Math.log(1 - raw / 8) ; // upward drags resist logarithmically\n    var h = drawer.offsetHeight, p = Math.max(0, Math.min(1, dy / h));\n    drawer.style.transform = 'translateY(' + dy + 'px)';\n    page.style.transform = 'translateY(' + (14 * (1 - p)) + 'px) scale(' + (SCALE + (1 - SCALE) * p) + ')';\n    page.style.borderRadius = (12 * (1 - p)) + 'px';\n    overlay.style.opacity = 1 - p;\n  });\n  function end() {\n    if (!dragging) return; dragging = false;\n    var v = dy / Math.max(1, Date.now() - t0), h = drawer.offsetHeight;\n    device.classList.remove('dragging');\n    drawer.style.transform = page.style.transform = page.style.borderRadius = overlay.style.opacity = '';\n    if (dy > h * 0.25 || v > 0.4) close();\n  }\n  drawer.addEventListener('pointerup', end); drawer.addEventListener('pointercancel', end);\n  page.inert = true;\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","why":"The page behind the sheet doesn't just dim: it recedes like a card, scaling down and rounding its corners, so the sheet feels physically on top. While you drag, the page, the dimming and the sheet all follow your finger together, and release decides by distance or speed.","take":"\u003cli>Scale the background to about .93 with a 14px drop and a 12px radius while the sheet is open. It explains depth better than a darker overlay.\u003c/li>\u003cli>Drive every layer from one number (drag progress 0–1) so they never disagree.\u003c/li>\u003cli>Close on a quarter of the sheet's height or a flick over 0.4px/ms. Otherwise snap back.\u003c/li>\u003cli>Resist upward drags with a logarithmic curve so the sheet feels attached rather than stuck.\u003c/li>\u003cli>Use one long easing for everything: 500ms \u003ccode>cubic-bezier(.32,.72,0,1)\u003c/code>, the curve iOS sheets are usually matched to.\u003c/li>\u003cli>Make the drag handle a real button that closes the sheet, for people who can't drag.\u003c/li>"},{"id":"hold-to-delete","title":"Hold to delete","kind":"component","tags":["form","destructive","feedback"],"origin":{"type":"original"},"summary":"A deliberate gesture instead of an \"Are you sure?\" dialog.","height":400,"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Hold to delete\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap\">\n\u003cstyle>\n  :root{\n    --page:#eef0f2;--card:#ffffff;--ink:#14171a;--ink2:#5d646c;--line:#e3e6e9;\n    --red:#c8321f;--red-soft:#fbeae7;--on-red:#ffffff;\n    --hold:1200ms;\n    font-family:\"Onest\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  }\n  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#101214;--card:#1a1d20;--ink:#eef0f2;--ink2:#9aa2aa;--line:#2b2f33;--red:#ff6b57;--red-soft:#3a1d19;--on-red:#1a0906}}\n  *{box-sizing:border-box}\n  html,body{height:100%}\n  body{margin:0;background:var(--page);color:var(--ink);display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}\n  button{font:inherit}\n  .card{width:min(420px,100%);background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(20,23,26,.04),0 18px 40px -24px rgba(20,23,26,.25)}\n  .card h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}\n  .facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 16px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}\n  .card p{margin:0 0 20px;font-size:14.5px;line-height:1.55;color:var(--ink2)}\n\n  .hold{position:relative;display:block;width:100%;height:52px;padding:0;border:0;border-radius:14px;background:var(--red-soft);color:var(--red);\n    font-weight:600;font-size:15px;cursor:pointer;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;\n    transition:transform 160ms ease}\n  .hold:focus-visible{outline:2px solid var(--ink);outline-offset:3px}\n  .hold .lbl,.hold .fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px}\n  /* the fill is a second copy of the label in reverse colours, revealed by a clip, so text never changes colour mid-letter by accident */\n  .hold .fill{background:var(--red);color:var(--on-red);clip-path:inset(0 100% 0 0);transition:clip-path 220ms cubic-bezier(.2,.8,.2,1)}\n  .hold.holding{transform:scale(.985)}\n  .hold.holding .fill{clip-path:inset(0 0 0 0);transition:clip-path var(--hold) linear}\n  .hold.done .fill{clip-path:inset(0 0 0 0);transition:none}\n  .hint{margin-top:10px;font-size:13px;color:var(--ink2);text-align:center;min-height:1.4em}\n\n  .gone{display:none;text-align:center}\n  .gone svg{width:40px;height:40px;margin:4px auto 10px;display:block}\n  .gone svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 400ms 120ms cubic-bezier(.2,.8,.2,1) forwards}\n  @keyframes draw{to{stroke-dashoffset:0}}\n  .restore{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;margin-top:4px}\n  .is-gone .live{display:none}.is-gone .gone{display:block}\n  @media (prefers-reduced-motion:reduce){.hold.holding{transform:none}.gone svg path{animation:none;stroke-dashoffset:0}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csection class=\"card\" id=\"card\" aria-labelledby=\"pt\">\n  \u003cdiv class=\"live\">\n    \u003ch1 id=\"pt\">Delete “Harbour survey”?\u003c/h1>\n    \u003cdiv class=\"facts\">\u003cspan>214 files\u003c/span>\u003cspan>3.2 GB\u003c/span>\u003cspan>Shared with 4 people\u003c/span>\u003c/div>\n    \u003cp>The project and its files move to Recently deleted for 30 days, then they’re gone for good.\u003c/p>\n    \u003cbutton class=\"hold\" id=\"hold\" type=\"button\" aria-describedby=\"hint\">\n      \u003cspan class=\"lbl\" aria-hidden=\"true\">Hold to delete\u003c/span>\n      \u003cspan class=\"fill\" aria-hidden=\"true\">Hold to delete\u003c/span>\n      \u003cspan class=\"sr\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Delete Harbour survey\u003c/span>\n    \u003c/button>\n    \u003cp class=\"hint\" id=\"hint\" aria-live=\"polite\">Press and hold for about a second.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"gone\" role=\"status\">\n    \u003csvg viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003ccircle cx=\"20\" cy=\"20\" r=\"19\" fill=\"var(--red-soft)\"/>\u003cpath d=\"m13 20.5 5 5 9-10\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n    \u003ch1>Harbour survey deleted\u003c/h1>\n    \u003cp style=\"margin:8px 0 14px\">You can restore it from Recently deleted until 24 October.\u003c/p>\n    \u003cbutton class=\"restore\" id=\"restore\" type=\"button\">Restore now\u003c/button>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript>\n(function () {\n  var btn = document.getElementById('hold'), hint = document.getElementById('hint'), card = document.getElementById('card');\n  var HOLD = 1200, timer = null, holding = false, keyDown = false;\n  function start() {\n    if (holding || btn.classList.contains('done')) return;\n    holding = true; btn.classList.add('holding'); hint.textContent = 'Keep holding…';\n    timer = setTimeout(finish, HOLD);\n  }\n  function cancel() {\n    if (!holding) return;\n    holding = false; clearTimeout(timer); btn.classList.remove('holding');\n    hint.textContent = 'Released early. Nothing was deleted.';\n  }\n  function finish() {\n    holding = false; btn.classList.remove('holding'); btn.classList.add('done');\n    setTimeout(function () { card.classList.add('is-gone'); document.getElementById('restore').focus(); }, 180);\n  }\n  btn.addEventListener('pointerdown', function (e) { if (e.button === 0) { btn.setPointerCapture(e.pointerId); start(); } });\n  btn.addEventListener('pointerup', cancel);\n  btn.addEventListener('pointercancel', cancel);\n  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });\n  // keyboard: holding Space or Enter works the same way; key repeat is ignored\n  btn.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !keyDown) { e.preventDefault(); keyDown = true; start(); } else if (e.key === ' ' || e.key === 'Enter') e.preventDefault(); });\n  btn.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') { keyDown = false; cancel(); } });\n  btn.addEventListener('blur', function () { keyDown = false; cancel(); });\n  btn.addEventListener('click', function (e) { e.preventDefault(); });\n  document.getElementById('restore').addEventListener('click', function () {\n    card.classList.remove('is-gone'); btn.classList.remove('done'); hint.textContent = 'Restored. Press and hold for about a second to delete.'; btn.focus();\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","why":"It replaces the &quot;Are you sure?&quot; dialog with a deliberate gesture that can't happen by accident, and it shows exactly how far along you are. Letting go early is safe and says so. The result states how to undo it.","take":"\u003cli>Confirm with duration instead of a second dialog. About 1.2s is long enough to be intentional and short enough not to annoy.\u003c/li>\u003cli>Reveal a reverse-colour copy of the label with a clip, so the text inverts cleanly as the fill passes it.\u003c/li>\u003cli>Fill linearly while holding, then retreat quickly (220ms, ease-out) on release. The asymmetry reads as &quot;safe to let go&quot;.\u003c/li>\u003cli>Say what happened when released early: &quot;Released early. Nothing was deleted.&quot;\u003c/li>\u003cli>Make it reversible anyway: the finished state names the restore deadline and offers &quot;Restore now&quot;.\u003c/li>"},{"id":"setup-checklist","title":"Setup checklist","kind":"component","tags":["onboarding","progress","disclosure"],"origin":{"type":"original"},"summary":"Always exactly one next thing, with time left instead of a percentage.","height":520,"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Setup checklist\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap\">\n\u003cstyle>\n  :root{\n    --page:#eceef1;--card:#ffffff;--ink:#101418;--ink2:#5b636c;--ink3:#8a929b;--line:#e6e9ec;--well:#f5f6f8;\n    --done:#1a7f4b;--done-soft:#e3f2ea;--btn:#101418;--on-btn:#ffffff;\n    --ease:cubic-bezier(.2,.8,.2,1);\n    font-family:\"Onest\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  }\n  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0f11;--card:#171a1d;--ink:#eef0f2;--ink2:#9ba3ab;--ink3:#737b83;--line:#272b2f;--well:#1f2326;--done:#4cc38a;--done-soft:#163225;--btn:#eef0f2;--on-btn:#101418}}\n  *{box-sizing:border-box}\n  html,body{min-height:100%}\n  body{margin:0;background:var(--page);color:var(--ink);display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}\n  button{font:inherit;color:inherit}\n  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}\n  .card{width:min(440px,100%);background:var(--card);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(16,20,24,.04),0 18px 40px -24px rgba(16,20,24,.25)}\n  .head{display:flex;align-items:center;gap:14px;padding:4px 4px 16px}\n  .ring{flex:none;width:44px;height:44px;position:relative}\n  .ring svg{width:44px;height:44px;transform:rotate(-90deg)}\n  .ring circle{fill:none;stroke-width:4}\n  .ring .track{stroke:var(--line)}\n  .ring .arc{stroke:var(--done);stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:calc(113.1 * (1 - var(--p,0)));transition:stroke-dashoffset 600ms var(--ease)}\n  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}\n  .head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}\n  .head p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}\n  .steps{margin:0;padding:0;list-style:none;display:grid;gap:2px}\n  .step{border-radius:14px;transition:background 200ms}\n  .step.open{background:var(--well)}\n  .row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border:0;background:none;text-align:left;cursor:pointer;border-radius:14px}\n  .tick{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);display:grid;place-items:center;transition:background 200ms,box-shadow 200ms}\n  .tick svg{width:12px;height:12px}\n  .tick path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset 280ms 80ms var(--ease)}\n  .done .tick{background:var(--done);box-shadow:none}\n  .done .tick path{stroke-dashoffset:0}\n  @media (prefers-color-scheme:dark){.tick path{stroke:#0d0f11}}\n  .title{flex:1;font-size:15px;font-weight:500}\n  .done .title{color:var(--ink2)}\n  .time{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}\n  .done .time{visibility:hidden}\n  /* the detail opens with a grid-rows transition so height animates without measuring */\n  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows 320ms var(--ease)}\n  .open .detail{grid-template-rows:1fr}\n  .detail > div{overflow:hidden}\n  .detail .in{padding:0 12px 14px 46px;display:grid;gap:12px;justify-items:start}\n  .detail p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2)}\n  .go{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--btn);color:var(--on-btn);font-weight:600;font-size:14px;cursor:pointer}\n  .complete{display:none;text-align:center;padding:12px 8px 8px}\n  .complete h1{margin:10px 0 4px;font-size:18px}\n  .complete p{margin:0 0 14px;color:var(--ink2);font-size:14px}\n  .complete button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:none;cursor:pointer}\n  .all .steps,.all .head{display:none}.all .complete{display:block}\n  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csection class=\"card\" id=\"card\" aria-labelledby=\"h\">\n  \u003cdiv class=\"head\">\n    \u003cdiv class=\"ring\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 44 44\">\u003ccircle class=\"track\" cx=\"22\" cy=\"22\" r=\"18\"/>\u003ccircle class=\"arc\" cx=\"22\" cy=\"22\" r=\"18\"/>\u003c/svg>\u003cb id=\"count\">2/5\u003c/b>\u003c/div>\n    \u003cdiv>\u003ch1 id=\"h\">Set up your workspace\u003c/h1>\u003cp id=\"left\" aria-live=\"polite\">3 steps left, about 6 minutes\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003col class=\"steps\" id=\"steps\">\u003c/ol>\n  \u003cdiv class=\"complete\" role=\"status\">\n    \u003csvg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\">\u003ccircle cx=\"22\" cy=\"22\" r=\"21\" fill=\"var(--done-soft)\"/>\u003cpath d=\"m14 22.5 5.5 5.5 10.5-11\" fill=\"none\" stroke=\"var(--done)\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n    \u003ch1>You’re set up\u003c/h1>\n    \u003cp>Reminders go out on Monday mornings. You can change any of this in Settings.\u003c/p>\n    \u003cbutton type=\"button\" id=\"again\">Show the checklist again\u003c/button>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript>\n(function () {\n  var data = [\n    { t: 'Create your workspace', min: 1, d: 'Name it and choose your currency.', a: 'Open workspace', done: true },\n    { t: 'Invite your accountant', min: 1, d: 'They get read-only access until you say otherwise.', a: 'Send invite', done: true },\n    { t: 'Connect your bank', min: 2, d: 'Transactions import every morning. Read-only, and you can disconnect at any time.', a: 'Connect bank' },\n    { t: 'Import last year’s invoices', min: 3, d: 'Drop a CSV or connect your old tool. Duplicates are skipped.', a: 'Import invoices' },\n    { t: 'Turn on payment reminders', min: 1, d: 'Clients get a polite nudge 3 days after an invoice is due.', a: 'Turn on reminders' }\n  ];\n  var list = document.getElementById('steps'), card = document.getElementById('card');\n  list.innerHTML = data.map(function (s, i) {\n    return '\u003cli class=\"step\" data-i=\"' + i + '\">\u003cbutton class=\"row\" type=\"button\" aria-expanded=\"false\" aria-controls=\"d' + i + '\">' +\n      '\u003cspan class=\"tick\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 12 12\">\u003cpath d=\"m2.5 6.3 2.3 2.3 4.7-5\"/>\u003c/svg>\u003c/span>' +\n      '\u003cspan class=\"title\">' + s.t + '\u003cspan class=\"sr\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">\u003c/span>\u003c/span>\u003cspan class=\"time\">' + s.min + ' min\u003c/span>\u003c/button>' +\n      '\u003cdiv class=\"detail\" id=\"d' + i + '\">\u003cdiv>\u003cdiv class=\"in\">\u003cp>' + s.d + '\u003c/p>\u003cbutton class=\"go\" type=\"button\">' + s.a + '\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/li>';\n  }).join('');\n  var items = [].slice.call(list.children);\n\n  function openOnly(i) {\n    items.forEach(function (li, k) {\n      var on = k === i; li.classList.toggle('open', on);\n      li.querySelector('.row').setAttribute('aria-expanded', on);\n      li.querySelector('.detail').inert = !on;\n    });\n  }\n  function sync() {\n    var n = data.filter(function (s) { return s.done; }).length, left = data.length - n;\n    var mins = data.reduce(function (a, s) { return a + (s.done ? 0 : s.min); }, 0);\n    items.forEach(function (li, k) { li.classList.toggle('done', !!data[k].done); li.querySelector('.sr').textContent = data[k].done ? ', done' : ', not done'; });\n    card.querySelector('.ring').style.setProperty('--p', n / data.length);\n    document.getElementById('count').textContent = n + '/' + data.length;\n    document.getElementById('left').textContent = left ? left + (left === 1 ? ' step' : ' steps') + ' left, about ' + mins + (mins === 1 ? ' minute' : ' minutes') : 'All done';\n  }\n  function next() { for (var k = 0; k \u003c data.length; k++) if (!data[k].done) return k; return -1; }\n\n  items.forEach(function (li, i) {\n    li.querySelector('.row').addEventListener('click', function () { openOnly(li.classList.contains('open') ? -1 : i); });\n    li.querySelector('.go').addEventListener('click', function () {\n      data[i].done = true; sync();\n      var k = next();\n      // let the tick draw before the next step opens\n      setTimeout(function () {\n        if (k === -1) { setTimeout(function () { card.classList.add('all'); document.getElementById('again').focus(); }, 500); openOnly(-1); }\n        else { openOnly(k); items[k].querySelector('.go').focus({ preventScroll: true }); }\n      }, 360);\n    });\n  });\n  document.getElementById('again').addEventListener('click', function () {\n    data.forEach(function (s, k) { s.done = k \u003c 2; }); card.classList.remove('all'); sync(); openOnly(2); items[2].querySelector('.row').focus();\n  });\n  sync(); openOnly(next());\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","why":"It always shows exactly one next thing. Finishing a step draws its tick, then the next step opens with its button already focused. The ring and the time-left line count down together, and when it's done it gets out of the way with a plain summary.","take":"\u003cli>Keep one step open at a time, and open the next as soon as the current one completes.\u003c/li>\u003cli>Estimate time per step and show the total left (&quot;3 steps left, about 6 minutes&quot;). It's more motivating than a percentage.\u003c/li>\u003cli>Draw the tick with a stroke-dashoffset after the fill (80ms delay), then wait for it before moving on (360ms).\u003c/li>\u003cli>Animate height with a \u003ccode>grid-template-rows: 0fr → 1fr\u003c/code> transition, with no measuring.\u003c/li>\u003cli>End on a statement of what's now true (&quot;Reminders go out on Monday mornings&quot;), not a celebration.\u003c/li>"},{"id":"pricing-screen","title":"Pricing screen","kind":"screen","tags":["commerce","marketing","numbers"],"origin":{"type":"original"},"summary":"Switch the billing period and every price rolls, digit by digit.","height":720,"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Pricing screen\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;500;600&display=swap\">\n\u003cstyle>\n  :root{\n    --ground:#f1f2f4;--card:#ffffff;--ink:#15181b;--ink2:#5a616a;--line:#e1e4e8;--green:#0f5c4a;--green-soft:#e3efe9;--on-green:#ffffff;\n    --display:\"Bricolage Grotesque\",system-ui,sans-serif;--ui:\"Figtree\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n    --roll:cubic-bezier(.2,.8,.2,1);\n  }\n  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--ground:#0f1113;--card:#181b1e;--ink:#eef0f2;--ink2:#9ba3ac;--line:#2a2e33;--green:#5cc8a8;--green-soft:#15302a;--on-green:#06231c}}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:40px 16px 56px}\n  button,a{font:inherit;color:inherit}\n  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}\n  .wrap{max-width:1000px;margin:0 auto}\n  .top{display:grid;justify-items:start;gap:12px;margin-bottom:28px}\n  .top h1{margin:0;font-family:var(--display);font-weight:650;font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:-.03em;max-width:18ch;text-wrap:balance}\n  .top p{margin:0;color:var(--ink2);max-width:52ch}\n\n  /* billing switch: a thumb slides under the chosen label */\n  .switch{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}\n  .switch button{position:relative;z-index:1;min-height:40px;padding:0 18px;border:0;background:none;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2);transition:color 200ms;white-space:nowrap}\n  .switch button[aria-pressed=\"true\"]{color:var(--on-green)}\n  .switch .save{font-weight:500;opacity:.85}\n  .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--green);transition:transform 380ms var(--roll)}\n  .annual .thumb{transform:translateX(100%)}\n\n  .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}\n  .plan{background:var(--card);border-radius:20px;padding:24px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:16px}\n  .plan.rec{box-shadow:inset 0 0 0 1.5px var(--green),0 24px 48px -28px rgba(15,92,74,.45)}\n  .plan h2{margin:0;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}\n  .tag{font-size:12px;font-weight:600;color:var(--green);background:var(--green-soft);padding:3px 9px;border-radius:999px}\n  .who{margin:-10px 0 0;color:var(--ink2);font-size:14px}\n  .price{display:flex;align-items:flex-end;gap:6px}\n  .amt{display:flex;font-family:var(--display);font-weight:650;font-size:52px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}\n  .amt .cur{font-size:.55em;margin:.12em .04em 0 0;align-self:flex-start;letter-spacing:0}\n  /* each digit is a strip 0–9 that rolls to its value */\n  .digit{display:inline-block;height:1em;overflow:hidden}\n  .digit span{display:flex;flex-direction:column;transition:transform 700ms var(--roll);transition-delay:var(--d,0ms)}\n  .digit span i{font-style:normal;height:1em;line-height:1}\n  .per{color:var(--ink2);font-size:14px;line-height:1.3;padding-bottom:4px}\n  .billed{margin:-8px 0 0;font-size:13px;color:var(--ink2);min-height:1.3em;font-variant-numeric:tabular-nums}\n  .cta{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font-weight:600;text-decoration:none;box-shadow:inset 0 0 0 1px var(--line);transition:background 160ms}\n  .cta:hover{background:var(--ground)}\n  .rec .cta{background:var(--green);color:var(--on-green);box-shadow:none}\n  .rec .cta:hover{background:var(--green);filter:brightness(1.08)}\n  .feats{margin:0;padding:0;list-style:none;display:grid;gap:9px;font-size:14px}\n  .feats .lead{color:var(--ink2);font-size:13px}\n  .feats li:not(.lead){display:grid;grid-template-columns:18px 1fr;gap:8px}\n  .feats svg{width:16px;height:16px;margin-top:2px;color:var(--green)}\n  .fine{margin-top:22px;font-size:13px;color:var(--ink2)}\n  @media (max-width:820px){.plans{grid-template-columns:1fr}.plan.rec{order:-1}}\n  @media (prefers-reduced-motion:reduce){.digit span,.thumb{transition:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\" id=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003ch1>Bookkeeping that’s done before you are.\u003c/h1>\n    \u003cp>Ledgerline sorts receipts, chases invoices and files your VAT return. Every plan includes Making Tax Digital filing.\u003c/p>\n    \u003cdiv class=\"switch\" role=\"group\" aria-label=\"Billing period\">\n      \u003cspan class=\"thumb\" aria-hidden=\"true\">\u003c/span>\n      \u003cbutton type=\"button\" aria-pressed=\"true\" data-period=\"month\">Monthly\u003c/button>\n      \u003cbutton type=\"button\" aria-pressed=\"false\" data-period=\"year\">Yearly \u003cspan class=\"save\">· 2 months free\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"plans\">\n    \u003csection class=\"plan\" aria-labelledby=\"p1\">\n      \u003ch2 id=\"p1\">Solo\u003c/h2>\n      \u003cp class=\"who\">For a sole trader with one income stream.\u003c/p>\n      \u003cdiv class=\"price\">\u003cdiv class=\"amt\" data-m=\"9\" data-y=\"7.50\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"per\">per month\u003c/div>\u003cspan class=\"sr\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\" aria-live=\"polite\">\u003c/span>\u003c/div>\n      \u003cp class=\"billed\">\u003c/p>\n      \u003ca class=\"cta\" href=\"#p1\">Start with Solo\u003c/a>\n      \u003cul class=\"feats\">\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Receipt capture by photo or email\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>1 bank feed\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Quarterly VAT filing\u003c/li>\u003c/ul>\n    \u003c/section>\n    \u003csection class=\"plan rec\" aria-labelledby=\"p2\">\n      \u003ch2 id=\"p2\">Studio \u003cspan class=\"tag\">Most chosen\u003c/span>\u003c/h2>\n      \u003cp class=\"who\">For a small business with a team of up to five.\u003c/p>\n      \u003cdiv class=\"price\">\u003cdiv class=\"amt\" data-m=\"24\" data-y=\"20\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"per\">per month\u003c/div>\u003cspan class=\"sr\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\" aria-live=\"polite\">\u003c/span>\u003c/div>\n      \u003cp class=\"billed\">\u003c/p>\n      \u003ca class=\"cta\" href=\"#p2\">Start with Studio\u003c/a>\n      \u003cul class=\"feats\">\u003cli class=\"lead\">Everything in Solo, plus:\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Invoice chasing on your schedule\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>5 bank feeds and 5 users\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Payroll for up to 5 people\u003c/li>\u003c/ul>\n    \u003c/section>\n    \u003csection class=\"plan\" aria-labelledby=\"p3\">\n      \u003ch2 id=\"p3\">Practice\u003c/h2>\n      \u003cp class=\"who\">For an accountant looking after many clients.\u003c/p>\n      \u003cdiv class=\"price\">\u003cdiv class=\"amt\" data-m=\"60\" data-y=\"50\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"per\">per month\u003c/div>\u003cspan class=\"sr\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\" aria-live=\"polite\">\u003c/span>\u003c/div>\n      \u003cp class=\"billed\">\u003c/p>\n      \u003ca class=\"cta\" href=\"#p3\">Talk to us\u003c/a>\n      \u003cul class=\"feats\">\u003cli class=\"lead\">Everything in Studio, plus:\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Unlimited client workspaces\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Bulk filing and review queue\u003c/li>\u003cli>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 8.5 3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Priority phone support\u003c/li>\u003c/ul>\n    \u003c/section>\n  \u003c/div>\n  \u003cp class=\"fine\">Prices exclude VAT. Yearly plans are billed once, up front, and can be refunded in the first 30 days. Ledgerline is an example product.\u003c/p>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var wrap = document.getElementById('wrap'), btns = [].slice.call(document.querySelectorAll('.switch button'));\n  var amts = [].slice.call(document.querySelectorAll('.amt'));\n  // build digit strips once, sized for the longest value either period can show\n  function fmt(v) { return (Math.round(v * 100) % 100 ? v.toFixed(2) : String(Math.round(v))); }\n  function strip() { var s = '\u003cspan>'; for (var d = 0; d \u003c= 9; d++) s += '\u003ci>' + d + '\u003c/i>'; return s + '\u003c/span>'; }\n  function render(el, value, animate) {\n    var text = fmt(value), html = '\u003cspan class=\"cur\">£\u003c/span>', n = 0;\n    text.split('').forEach(function (ch) {\n      if (ch === '.') { html += '\u003cspan>.\u003c/span>'; return; }\n      html += '\u003cspan class=\"digit\" data-v=\"' + ch + '\" style=\"--d:' + (n++ * 40) + 'ms\">' + strip() + '\u003c/span>';\n    });\n    // reuse existing strips where the shape matches so they roll instead of jump\n    if (animate && el.dataset.shape === text.replace(/\\d/g, '0')) {\n      [].forEach.call(el.querySelectorAll('.digit'), function (dg, i) { var v = text.replace('.', '')[i]; dg.firstChild.style.transform = 'translateY(' + (-v) + 'em)'; });\n    } else {\n      // a new shape (9 → 7.50) builds fresh strips at 0 and rolls them up to their values\n      el.innerHTML = html; el.dataset.shape = text.replace(/\\d/g, '0');\n      var digits = [].slice.call(el.querySelectorAll('.digit'));\n      if (animate) { digits.forEach(function (dg) { dg.firstChild.style.transform = 'translateY(0)'; }); el.offsetHeight; }\n      digits.forEach(function (dg) { dg.firstChild.style.transform = 'translateY(' + (-dg.dataset.v) + 'em)'; });\n    }\n  }\n  function set(period, animate) {\n    var yearly = period === 'year';\n    wrap.classList.toggle('annual', yearly);\n    document.querySelector('.switch').classList.toggle('annual', yearly);\n    btns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.period === period); });\n    amts.forEach(function (el) {\n      var m = +el.dataset.m, v = yearly ? +el.dataset.y : m;\n      render(el, v, animate);\n      var plan = el.closest('.plan');\n      plan.querySelector('.billed').textContent = yearly ? '£' + (m * 10) + ' billed yearly, saving £' + (m * 2) : 'Billed monthly, cancel any time';\n      plan.querySelector('.sr').textContent = '£' + fmt(v) + ' per month';\n    });\n  }\n  btns.forEach(function (b) { b.addEventListener('click', function () { set(b.dataset.period, true); }); });\n  set('month', false);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","why":"Switching billing period is the one interaction on a pricing page, and here it is felt. The thumb slides, each price rolls digit by digit to its new value, and the line underneath does the arithmetic (&quot;£240 billed yearly, saving £48&quot;), so nobody has to.","take":"\u003cli>Roll the digits: each digit is a 0–9 strip translated to its value, staggered 40ms left to right. When the shape changes (9 → 7.50), the new strips roll up from 0.\u003c/li>\u003cli>Show the monthly equivalent large and the actual charge small, and put the saving in money rather than a percentage.\u003c/li>\u003cli>Make one plan recommended with a ring and the only shadow, and make its button the only filled one.\u003c/li>\u003cli>On phones, move the recommended plan first.\u003c/li>\u003cli>Lead each higher tier with &quot;Everything in X, plus:&quot; so the lists stay short.\u003c/li>"}]</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var grid = document.getElementById('grid'), kind = 'all', tag = null;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  grid.innerHTML = data.map(function (e) {
    var o = e.origin.type === 'study'
      ? 'Study of <a href="' + esc(e.origin.url) + '" target="_blank" rel="noopener">' + esc(e.origin.name) + '</a>' + (e.origin.name.indexOf(e.origin.maker) > -1 ? '' : ' by ' + esc(e.origin.maker))
      : 'Original';
    return '<article class="entry ' + e.kind + '" data-id="' + e.id + '" aria-labelledby="t-' + e.id + '">' +
      '<div class="stage"><iframe title="' + esc(e.title) + ' demo" style="--h:' + e.height + 'px" loading="eager"></iframe></div>' +
      '<div class="info"><div class="line1"><h2 id="t-' + e.id + '">' + esc(e.title) + '</h2><span class="origin">' + o + '</span></div>' +
      '<p class="sum">' + esc(e.summary) + '</p>' +
      '<div class="meta"><span class="chip kind">' + e.kind + '</span>' + e.tags.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<details><summary>Why it works, and what to take</summary><p class="why">' + e.why + '</p><ul class="take">' + e.take + '</ul></details>' +
      '<div class="row"><button class="btn" type="button" data-full="' + e.id + '">Open full size</button></div></div></article>';
  }).join('');
  [].forEach.call(grid.querySelectorAll('.entry'), function (el, i) { el.querySelector('iframe').srcdoc = data[i].html; });

  function apply() {
    var shown = 0;
    [].forEach.call(grid.children, function (el, i) {
      var e = data[i], ok = (kind === 'all' || e.kind === kind) && (!tag || e.tags.indexOf(tag) > -1);
      el.hidden = !ok; if (ok) shown++;
    });
    document.getElementById('empty').hidden = shown > 0;
  }
  [].forEach.call(document.querySelectorAll('[data-kind]'), function (b, _, all) {
    b.addEventListener('click', function () { kind = b.dataset.kind; [].forEach.call(document.querySelectorAll('[data-kind]'), function (x) { x.setAttribute('aria-pressed', x === b); }); apply(); });
  });
  [].forEach.call(document.querySelectorAll('[data-tag]'), function (b) {
    b.addEventListener('click', function () {
      tag = tag === b.dataset.tag ? null : b.dataset.tag;
      [].forEach.call(document.querySelectorAll('[data-tag]'), function (x) { x.setAttribute('aria-pressed', x.dataset.tag === tag); });
      apply();
    });
  });

  var dlg = document.getElementById('full'), frame = document.getElementById('fullFrame');
  grid.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-full]'); if (!b) return;
    var e = data.filter(function (x) { return x.id === b.dataset.full; })[0];
    document.getElementById('fullTitle').textContent = e.title; frame.title = e.title + ' demo, full size'; frame.srcdoc = e.html;
    dlg.showModal();
  });
  document.getElementById('closeFull').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('close', function () { frame.srcdoc = ''; });
})();
</script>
