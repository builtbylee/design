<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold to delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
  :root{
    --page:#eef0f2;--card:#ffffff;--ink:#14171a;--ink2:#5d646c;--line:#e3e6e9;
    --red:#c8321f;--red-soft:#fbeae7;--on-red:#ffffff;
    --hold:1200ms;
    font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#101214;--card:#1a1d20;--ink:#eef0f2;--ink2:#9aa2aa;--line:#2b2f33;--red:#ff6b57;--red-soft:#3a1d19;--on-red:#1a0906}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
  button{font:inherit}
  .card{width:min(420px,100%);background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(20,23,26,.04),0 18px 40px -24px rgba(20,23,26,.25)}
  .card h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 16px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .card p{margin:0 0 20px;font-size:14.5px;line-height:1.55;color:var(--ink2)}

  .hold{position:relative;display:block;width:100%;height:52px;padding:0;border:0;border-radius:14px;background:var(--red-soft);color:var(--red);
    font-weight:600;font-size:15px;cursor:pointer;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    transition:transform 160ms ease}
  .hold:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .hold .lbl,.hold .fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px}
  /* the fill is a second copy of the label in reverse colours, revealed by a clip, so text never changes colour mid-letter by accident */
  .hold .fill{background:var(--red);color:var(--on-red);clip-path:inset(0 100% 0 0);transition:clip-path 220ms cubic-bezier(.2,.8,.2,1)}
  .hold.holding{transform:scale(.985)}
  .hold.holding .fill{clip-path:inset(0 0 0 0);transition:clip-path var(--hold) linear}
  .hold.done .fill{clip-path:inset(0 0 0 0);transition:none}
  .hint{margin-top:10px;font-size:13px;color:var(--ink2);text-align:center;min-height:1.4em}

  .gone{display:none;text-align:center}
  .gone svg{width:40px;height:40px;margin:4px auto 10px;display:block}
  .gone svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 400ms 120ms cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .restore{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;margin-top:4px}
  .is-gone .live{display:none}.is-gone .gone{display:block}
  @media (prefers-reduced-motion:reduce){.hold.holding{transform:none}.gone svg path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<section class="card" id="card" aria-labelledby="pt">
  <div class="live">
    <h1 id="pt">Delete “Harbour survey”?</h1>
    <div class="facts"><span>214 files</span><span>3.2 GB</span><span>Shared with 4 people</span></div>
    <p>The project and its files move to Recently deleted for 30 days, then they’re gone for good.</p>
    <button class="hold" id="hold" type="button" aria-describedby="hint">
      <span class="lbl" aria-hidden="true">Hold to delete</span>
      <span class="fill" aria-hidden="true">Hold to delete</span>
      <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Delete Harbour survey</span>
    </button>
    <p class="hint" id="hint" aria-live="polite">Press and hold for about a second.</p>
  </div>
  <div class="gone" role="status">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--red-soft)"/><path d="m13 20.5 5 5 9-10" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Harbour survey deleted</h1>
    <p style="margin:8px 0 14px">You can restore it from Recently deleted until 24 October.</p>
    <button class="restore" id="restore" type="button">Restore now</button>
  </div>
</section>

<script>
(function () {
  var btn = document.getElementById('hold'), hint = document.getElementById('hint'), card = document.getElementById('card');
  var HOLD = 1200, timer = null, holding = false, keyDown = false;
  function start() {
    if (holding || btn.classList.contains('done')) return;
    holding = true; btn.classList.add('holding'); hint.textContent = 'Keep holding…';
    timer = setTimeout(finish, HOLD);
  }
  function cancel() {
    if (!holding) return;
    holding = false; clearTimeout(timer); btn.classList.remove('holding');
    hint.textContent = 'Released early. Nothing was deleted.';
  }
  function finish() {
    holding = false; btn.classList.remove('holding'); btn.classList.add('done');
    setTimeout(function () { card.classList.add('is-gone'); document.getElementById('restore').focus(); }, 180);
  }
  btn.addEventListener('pointerdown', function (e) { if (e.button === 0) { btn.setPointerCapture(e.pointerId); start(); } });
  btn.addEventListener('pointerup', cancel);
  btn.addEventListener('pointercancel', cancel);
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // keyboard: holding Space or Enter works the same way; key repeat is ignored
  btn.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !keyDown) { e.preventDefault(); keyDown = true; start(); } else if (e.key === ' ' || e.key === 'Enter') e.preventDefault(); });
  btn.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') { keyDown = false; cancel(); } });
  btn.addEventListener('blur', function () { keyDown = false; cancel(); });
  btn.addEventListener('click', function (e) { e.preventDefault(); });
  document.getElementById('restore').addEventListener('click', function () {
    card.classList.remove('is-gone'); btn.classList.remove('done'); hint.textContent = 'Restored. Press and hold for about a second to delete.'; btn.focus();
  });
})();
</script>
</body>
</html>
