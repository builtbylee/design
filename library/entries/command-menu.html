<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command menu</title>
<style>
  :root{
    --page:#f7f7f8;--panel:#ffffff;--ink:#1b1c1f;--ink2:#6b6f76;--ink3:#72767e;--line:rgba(20,22,26,.08);
    --row:rgba(20,22,26,.055);--chip:#f1f1f3;--key:#f4f4f6;--key-line:rgba(20,22,26,.12);--scrim:rgba(245,245,247,.55);
    --shadow:0 0 0 1px rgba(20,22,26,.06),0 16px 70px -12px rgba(20,22,26,.28),0 4px 12px -4px rgba(20,22,26,.08);
    --ease:cubic-bezier(.16,1,.3,1);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;
    --page:#0f1012;--panel:#1c1d21;--ink:#ececef;--ink2:#9a9ca3;--ink3:#8b8d94;--line:rgba(255,255,255,.07);
    --row:rgba(255,255,255,.06);--chip:#26272c;--key:#2a2b30;--key-line:rgba(255,255,255,.1);--scrim:rgba(8,8,10,.5);
    --shadow:0 0 0 1px rgba(255,255,255,.06),0 16px 70px -8px rgba(0,0,0,.7)}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid #5e6ad2;outline-offset:2px}

  /* the page behind: a quiet issue view */
  .app{max-width:760px;margin:0 auto;padding:28px 20px}
  .crumbs{font-size:13px;color:var(--ink2)}
  .app h1{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:10px 0 12px}
  .app p{color:var(--ink2);line-height:1.6;max-width:60ch;margin:0 0 18px}
  .open{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
  .ran{margin-top:14px;min-height:20px;font-size:13px;color:var(--ink2)}

  /* the menu */
  .scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transition:opacity 160ms var(--ease)}
  .menu{position:fixed;left:50%;top:max(12vh,24px);width:min(640px,calc(100% - 24px));transform:translateX(-50%) scale(.96);opacity:0;
    background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;transition:transform 180ms var(--ease),opacity 140ms var(--ease)}
  .is-open .scrim{opacity:1}
  .is-open .menu{transform:translateX(-50%) scale(1);opacity:1}
  .shell[hidden]{display:none}
  .ctx{display:inline-flex;align-items:center;gap:6px;margin:12px 14px 0;padding:3px 8px;border-radius:6px;background:var(--chip);font-size:12px;color:var(--ink2);max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctx b{font-weight:500;color:var(--ink)}
  .search{display:block;width:100%;height:52px;padding:0 18px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:17px;outline:none}
  .search::placeholder{color:var(--ink3)}
  .listwrap{height:var(--h,auto);overflow:hidden;transition:height 120ms var(--ease)}
  .list{max-height:min(380px,56vh);overflow-y:auto;padding:6px;scroll-padding:6px}
  .group{padding:10px 10px 6px;font-size:12px;font-weight:500;color:var(--ink3)}
  .item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
  .item[aria-selected="true"]{background:var(--row)}
  .item svg{flex:none;width:16px;height:16px;color:var(--ink2)}
  .item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .lbl mark{background:none;color:inherit;font-weight:650}
  .keys{display:flex;gap:4px;flex:none}
  .keys kbd{min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;border-radius:4px;background:var(--key);box-shadow:inset 0 0 0 1px var(--key-line);font:500 11px system-ui,sans-serif;color:var(--ink2)}
  .keys .then{font-size:11px;color:var(--ink3);align-self:center}
  .empty{padding:28px 16px 30px;text-align:center;color:var(--ink2)}
  .empty b{color:var(--ink);font-weight:500}
  @media (max-width:520px){.keys{display:none}.menu{top:12px}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="app" aria-hidden="false" id="app">
  <p class="crumbs">Mobile app · Issues · MOB-142</p>
  <h1>Onboarding skips the notification prompt on iOS 18</h1>
  <p>New users who deny tracking are never shown the notification prompt, so reminders silently stop working. Reproduced on two devices.</p>
  <button class="open" type="button" id="opener">Open command menu <span class="keys" aria-hidden="true"><kbd id="mod">⌘</kbd><kbd>K</kbd></span></button>
  <p class="ran" id="ran" role="status"></p>
</div>

<div class="shell is-open" id="shell">
  <div class="scrim" id="scrim"></div>
  <div class="menu" role="dialog" aria-modal="true" aria-label="Command menu">
    <span class="ctx">Acting on <b>MOB-142</b> Onboarding skips the notification prompt</span>
    <input class="search" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Type a command or search…">
    <div class="listwrap" id="wrap"><div class="list" id="list" role="listbox" aria-label="Commands"></div></div>
  </div>
</div>

<script>
(function () {
  var I = {
    status:'<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.6 2.1"/>',
    user:'<circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.8 14c.6-2.6 2.7-4 5.2-4s4.6 1.4 5.2 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    prio:'<path d="M3 13V10M8 13V6.5M13 13V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    tag:'<path d="M2.5 8.2V3.3c0-.5.4-.8.8-.8h4.9l5.3 5.3-5.7 5.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="5.4" cy="5.4" r="1" fill="currentColor"/>',
    inbox:'<path d="M2.5 9.5 4 3.5h8l1.5 6v3h-11zM2.5 9.5h3.2l.8 1.5h3l.8-1.5h3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
    list:'<path d="M5.5 4.5h8M5.5 8h8M5.5 11.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="2.8" cy="4.5" r="1" fill="currentColor"/><circle cx="2.8" cy="8" r="1" fill="currentColor"/><circle cx="2.8" cy="11.5" r="1" fill="currentColor"/>',
    cycle:'<path d="M13 6.5A5.2 5.2 0 0 0 3.4 5M3 9.5A5.2 5.2 0 0 0 12.6 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3 2.5V5.2h2.7M13 13.5v-2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
    plus:'<path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    link:'<path d="M7 9a2.6 2.6 0 0 0 3.7 0l2-2A2.6 2.6 0 0 0 9 3.3l-.7.7M9 7a2.6 2.6 0 0 0-3.7 0l-2 2A2.6 2.6 0 0 0 7 12.7l.7-.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    archive:'<path d="M2.5 3h11v3h-11zM3.5 6v7h9V6M6.5 8.7h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'
  };
  var mod = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';
  document.getElementById('mod').textContent = mod;
  var groups = [
    ['Issue', [['Change status…','status',['S']],['Assign to…','user',['A']],['Change priority…','prio',['P']],['Add label…','tag',['L']]]],
    ['Navigate', [['Go to inbox','inbox',['G','then','I']],['Go to my issues','list',['G','then','M']],['Go to current cycle','cycle',['G','then','C']]]],
    ['Actions', [['Create new issue','plus',['C']],['Copy issue link','link',[mod,'⇧','C']],['Archive issue','archive',[mod,'⌫']]]]
  ];
  var shell = document.getElementById('shell'), q = document.getElementById('q'), list = document.getElementById('list'), wrap = document.getElementById('wrap');
  var items = [], active = 0, lastFocus = null;

  // subsequence match: returns indices of matched characters, or null
  function match(label, query) {
    if (!query) return [];
    var l = label.toLowerCase(), out = [], j = 0;
    for (var i = 0; i < l.length && j < query.length; i++) if (l[i] === query[j]) { out.push(i); j++; }
    return j === query.length ? out : null;
  }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function highlight(label, idx) {
    if (!idx.length) return esc(label);
    return label.split('').map(function (c, i) { return idx.indexOf(i) > -1 ? '<mark>' + esc(c) + '</mark>' : esc(c); }).join('');
  }
  function render() {
    var query = q.value.trim().toLowerCase(), html = '', n = 0;
    groups.forEach(function (g) {
      var rows = '';
      g[1].forEach(function (c) {
        var m = match(c[0], query); if (!m) return;
        var keys = c[2].map(function (k) { return k === 'then' ? '<span class="then">then</span>' : '<kbd>' + k + '</kbd>'; }).join('');
        rows += '<button type="button" class="item" role="option" tabindex="-1" id="o' + n + '" data-n="' + n + '" data-label="' + esc(c[0]) + '" aria-selected="false">' +
          '<svg viewBox="0 0 16 16" aria-hidden="true">' + I[c[1]] + '</svg><span class="lbl">' + highlight(c[0], m) + '</span><span class="keys" aria-hidden="true">' + keys + '</span></button>';
        n++;
      });
      if (rows) html += '<div role="group" aria-label="' + g[0] + '"><div class="group" aria-hidden="true">' + g[0] + '</div>' + rows + '</div>';
    });
    // animate the list height between result counts
    var from = wrap.offsetHeight;
    list.innerHTML = html || '<p class="empty">No commands match <b>“' + esc(q.value) + '”</b>. Try “status” or “go to”.</p>';
    items = [].slice.call(list.querySelectorAll('.item'));
    var to = list.offsetHeight;
    wrap.style.setProperty('--h', from + 'px'); wrap.offsetHeight; wrap.style.setProperty('--h', to + 'px');
    select(0, false);
  }
  function select(i, scroll) {
    if (!items.length) { q.removeAttribute('aria-activedescendant'); return; }
    active = (i + items.length) % items.length;
    items.forEach(function (el, k) { el.setAttribute('aria-selected', k === active); });
    q.setAttribute('aria-activedescendant', items[active].id);
    if (scroll !== false) items[active].scrollIntoView({ block: 'nearest' });
  }
  function run(el) {
    document.getElementById('ran').textContent = 'Ran “' + el.dataset.label + '” on MOB-142.';
    close();
  }
  function open() {
    lastFocus = document.activeElement; shell.hidden = false; q.value = ''; render();
    requestAnimationFrame(function () { shell.classList.add('is-open'); q.focus(); });
  }
  function close() {
    shell.classList.remove('is-open');
    setTimeout(function () { shell.hidden = true; }, 160);
    (lastFocus && lastFocus !== document.body ? lastFocus : document.getElementById('opener')).focus();
  }
  q.addEventListener('input', render);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); select(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(active - 1); }
    else if (e.key === 'Enter' && items[active]) { e.preventDefault(); run(items[active]); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'Tab') e.preventDefault();
  });
  list.addEventListener('pointermove', function (e) { var el = e.target.closest('.item'); if (el && +el.dataset.n !== active) select(+el.dataset.n, false); });
  list.addEventListener('click', function (e) { var el = e.target.closest('.item'); if (el) run(el); });
  document.getElementById('scrim').addEventListener('click', close);
  document.getElementById('opener').addEventListener('click', open);
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); shell.hidden ? open() : close(); }
  });
  render();
  // the demo opens with the menu showing; focus only if the frame already has focus
  if (document.hasFocus()) q.focus();
})();
</script>
</body>
</html>
